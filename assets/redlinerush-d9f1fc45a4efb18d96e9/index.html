<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Redline Rush</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
    <script type="importmap">
      {
        "imports": {
          "gladiator-engine/dist/engine.js": "./engine/engine.js",
          "gladiator-engine/dist/config.js": "./engine/config.js"
        }
      }
    </script>
    <style>
      :root {
        --bg: #0a0e1a; --panel: #141d33; --panel2: #0e1626; --line: rgba(120,150,220,0.18);
        --ink: #eef3ff; --dim: #8b97b8; --orange: #ff7a1a; --orange2: #ffb24d;
        --red: #ff3142; --blue: #2f8bff; --yellow: #ffce33;
        --green1: #25cf63; --green2: #18a850; --shadow: 0 12px 36px rgba(0,0,0,.5);
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg);
        color: var(--ink); font-family: "Rajdhani", system-ui, sans-serif; }
      #app { position: relative; display: flex; flex-direction: column; height: 100%; }

      /* ============ HEADER ============ */
      header { position: relative; z-index: 6; display: flex; align-items: center; justify-content: center;
        padding: 12px 18px 10px; min-height: 60px; }
      .logo { height: 42px; }
      .walletbox { position: absolute; right: 22px; top: 10px; display: flex; align-items: center; gap: 12px; }
      .balance { text-align: right; }
      .balance .label { font-size: 11px; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; }
      .balance .val { font-family: "Orbitron"; font-weight: 700; font-size: 27px; }
      #topup { background: none; border: 1px solid var(--line);
        color: var(--dim); border-radius: 8px; padding: 6px 11px; font-family: "Rajdhani"; font-weight: 700; font-size: 13px; cursor: pointer; }

      /* ============ SOUND CONTROL ============ */
      .soundctl { position: relative; }
      .soundbtn { background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 8px;
        width: 38px; height: 34px; font-size: 16px; line-height: 1; cursor: pointer; }
      .soundbtn.off { color: var(--dim); }
      .soundpop { position: absolute; top: calc(100% + 8px); right: 0; z-index: 30; width: 168px; display: none;
        flex-direction: column; gap: 9px; padding: 12px; border-radius: 10px;
        background: rgba(14,22,40,.97); border: 1px solid var(--line); box-shadow: var(--shadow); }
      .soundpop.open { display: flex; }
      .soundpop .sprow { display: flex; justify-content: space-between; font-size: 11px; letter-spacing: 1px;
        color: var(--dim); text-transform: uppercase; font-family: "Orbitron"; font-weight: 700; }
      .soundpop #soundVol { width: 100%; accent-color: var(--orange); cursor: pointer; }
      .soundpop .mutebtn { background: #0a1120; border: 1px solid var(--line); color: var(--ink); border-radius: 8px;
        padding: 8px 0; font-family: "Orbitron"; font-weight: 700; font-size: 12px; cursor: pointer; }
      .soundpop .mutebtn.muted { color: var(--red); border-color: var(--red); }

      /* ============ ROUND HISTORY (tile under balance) ============ */
      .rh-toggle, .rh-close { display: none; } /* shown only on mobile (drawer handle / close) */
      .rhistory { position: absolute; z-index: 8; right: 22px; top: 82px; display: flex; flex-direction: column; gap: 4px;
        padding: 9px 11px; border-radius: 12px; pointer-events: none;
        background: rgba(8,12,22,.72); border: 1px solid var(--line); backdrop-filter: blur(6px); box-shadow: var(--shadow); }
      .rhtitle { font-family: "Orbitron"; font-weight: 800; font-size: 10px; letter-spacing: 1.5px; color: var(--dim);
        text-transform: uppercase; margin-bottom: 3px; }
      .rhrow { display: flex; align-items: center; gap: 9px; white-space: nowrap; padding: 2px 5px; border-radius: 8px; }
      .rhrow.red { color: var(--red); background: rgba(255,49,66,.10); }
      .rhrow.blue { color: var(--blue); background: rgba(47,139,255,.12); }
      .rhrow.yellow { color: var(--yellow); background: rgba(255,206,51,.10); }
      .rhrow .chips { display: flex; gap: 3px; }
      .rhchip { flex: none; font-family: "Orbitron"; font-weight: 700; font-size: 10px; padding: 3px 7px; border-radius: 5px;
        min-width: 38px; text-align: center; white-space: nowrap; background: rgba(255,255,255,.05); border: 1px solid var(--line); color: var(--dim); }
      .rhchip.hi { color: currentColor; border-color: currentColor; background: rgba(255,255,255,.03); box-shadow: 0 0 9px -3px currentColor; }
      .rhchip.empty { color: var(--dim); opacity: .35; }
      input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
      input[type=number] { -moz-appearance: textfield; appearance: textfield; }

      /* ============ LEADER (header, left of the logo) ============ */
      .leaders { position: absolute; z-index: 7; left: 18px; top: 50%; transform: translateY(-50%);
        display: flex; align-items: baseline; gap: 8px; }
      .leaders .label { font-size: 11px; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; }
      .leaders .big { font-family: "Orbitron"; font-weight: 900; font-size: 24px; line-height: 1;
        color: var(--orange2); text-shadow: 0 0 16px currentColor; transition: color .2s; }

      /* ============ TRACK ============ */
      .track { position: relative; flex: 1; min-height: 0; overflow: hidden;
        background: #0a0e1a url(assets/bg-landscape2.png) repeat-x 0 center / auto 100%; }
      /* drivable band measured from the bg image: lanes between ~25% and ~74% */
      .lanes { position: absolute; left: 0; right: 0; top: 25%; bottom: 26%; display: flex; flex-direction: column; }
      .lane { position: relative; flex: 1; cursor: pointer; }
      .lanes.locked .lane { cursor: default; }

      /* ============ START LIGHTS ============ */
      .startlights { position: absolute; z-index: 9; left: 50%; top: 50%; transform: translate(-50%,-50%);
        display: none; flex-direction: column; align-items: center; gap: 14px; pointer-events: none; }
      .startlights.show { display: flex; }
      .lpole { display: flex; gap: 14px; padding: 16px 20px; border-radius: 16px;
        background: rgba(8,12,22,.88); border: 2px solid #1c2740; box-shadow: 0 16px 44px rgba(0,0,0,.6); }
      .lcol { display: flex; flex-direction: column; gap: 9px; }
      .bulb { display: block; width: 36px; height: 36px; border-radius: 50%; background: #2a0a0e;
        box-shadow: inset 0 0 9px rgba(0,0,0,.85); transition: background .1s, box-shadow .1s; }
      .lcol.on .bulb { background: radial-gradient(circle at 40% 35%, #ff8a8a, #ff1b2c 58%, #8e0007 100%);
        box-shadow: 0 0 20px 2px rgba(255,40,55,.85), inset 0 0 6px rgba(255,255,255,.4); }
      .startlights.go .bulb { background: radial-gradient(circle at 40% 35%, #9dffbd, #18c95a 58%, #0a8c44 100%);
        box-shadow: 0 0 22px 3px rgba(37,207,99,.9), inset 0 0 6px rgba(255,255,255,.4); }
      .gotext { font-family: "Orbitron"; font-weight: 900; font-size: 60px; letter-spacing: 2px; color: var(--green1);
        text-shadow: 0 0 26px rgba(37,207,99,.9), 0 2px 6px rgba(0,0,0,.5); opacity: 0; transform: scale(.7); transition: opacity .15s, transform .15s; }
      .startlights.go .gotext { opacity: 1; transform: scale(1); }
      /* highlight starts just past the LIVE DRIVERS panel (panel right edge ≈ 296px) */
      .lane.sel::before { content: ""; position: absolute; z-index: 3; top: 4px; bottom: 4px; left: 308px; right: 6px; border-radius: 16px;
        border: 2.5px solid currentColor; pointer-events: none;
        box-shadow: inset 0 0 60px -8px currentColor, 0 0 26px -2px currentColor;
        animation: selpulse 1.3s ease-in-out infinite; }
      .lane.sel::after { content: "◂ YOUR CAR"; position: absolute; z-index: 3; right: 12px; left: auto; bottom: 10px;
        font-family: "Orbitron"; font-weight: 800; font-size: 11px; letter-spacing: 1px; color: currentColor;
        background: rgba(8,12,22,.78); padding: 4px 9px; border-radius: 7px; border: 1px solid currentColor;
        box-shadow: 0 0 12px -2px currentColor; text-shadow: 0 0 6px currentColor; pointer-events: none; }
      @keyframes selpulse { 0%,100% { box-shadow: inset 0 0 60px -8px currentColor, 0 0 22px -2px currentColor; }
        50% { box-shadow: inset 0 0 80px -4px currentColor, 0 0 40px 0 currentColor; } }
      .lane.red { color: var(--red); } .lane.blue { color: var(--blue); } .lane.yellow { color: var(--yellow); }

      .trail { position: absolute; z-index: 1; top: 54%; height: 14%; transform: translateY(-50%);
        background: linear-gradient(90deg, transparent, currentColor 90%); border-radius: 60px;
        filter: blur(8px) saturate(1.7) brightness(1.35); mix-blend-mode: screen; opacity: 0; transition: opacity .15s; pointer-events: none; }
      /* camera positions the wrapper; the car body + wheels + exhaust live inside and animate */
      .carwrap { position: absolute; z-index: 2; top: 50%; height: 96%; transform: translate(-50%,-50%);
        will-change: left, transform; pointer-events: none; }
      .car { display: block; height: 100%; width: auto; will-change: transform;
        filter: saturate(1.55) brightness(1.22) contrast(1.04) drop-shadow(0 10px 12px rgba(0,0,0,.5)); }
      .wheels { position: absolute; inset: 0; pointer-events: none; } /* container: all frames preloaded, one shown */
      .wheels img { position: absolute; inset: 0; width: 100%; height: 100%; display: none;
        filter: saturate(1.55) brightness(1.22) contrast(1.04); } /* rotating wheel frames overlaid on the car body */
      .wheels img.on { display: block; }
      .car.dead { filter: grayscale(.65) brightness(.6) drop-shadow(0 10px 12px rgba(0,0,0,.5)); } /* dimmed, still visible as it slides off */
      .car.dead.winner { filter: saturate(1.7) brightness(1.4) drop-shadow(0 0 22px currentColor); } /* last survivor bolts away at full power */
      /* neon exhaust glow behind the car (faces right, so the glow sits on its left), in the car's colour */
      .exhaust { position: absolute; left: 2%; top: 50%; width: 40%; height: 52%; transform: translate(-50%,-50%);
        border-radius: 50%; pointer-events: none; opacity: 0; color: currentColor; mix-blend-mode: screen;
        background: radial-gradient(ellipse at right, currentColor 0%, color-mix(in srgb, currentColor 55%, transparent) 45%, transparent 72%);
        filter: blur(6px) saturate(1.6) brightness(1.3); }
      .shadow { position: absolute; z-index: 1; top: 62%; transform: translate(-50%,-50%); border-radius: 50%;
        background: radial-gradient(ellipse at center, rgba(0,0,0,.55) 0%, rgba(0,0,0,.3) 46%, transparent 72%);
        filter: blur(3px); opacity: 0; pointer-events: none; }
      .mult { position: absolute; z-index: 5; top: 1%; font-family: "Orbitron"; font-weight: 900;
        font-size: clamp(24px, 3.6vw, 48px); transform: translateX(-50%); letter-spacing: 1px; pointer-events: none;
        -webkit-text-fill-color: #fff;
        text-shadow: 0 0 6px currentColor, 0 0 14px currentColor, 0 0 28px currentColor, 0 0 50px currentColor, 0 2px 4px rgba(0,0,0,.5); }
      .mult.dead { -webkit-text-fill-color: currentColor; } /* final crash value, tinted in the car's colour */
      .mult.parked { left: 314px; transform: none; } /* crashed value parks at the left edge of the glow, right of LIVE DRIVERS */

      /* ============ LIVE DRIVERS ============ */
      .drivers-toggle, .drivers-close { display: none; } /* shown only on mobile (drawer handle / close) */
      .drivers { position: absolute; z-index: 4; left: 14px; top: 14px; width: 282px;
        background: linear-gradient(180deg, rgba(14,22,40,.62), rgba(9,14,26,.55)); backdrop-filter: blur(3px);
        border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; box-shadow: var(--shadow);
        text-shadow: 0 1px 3px rgba(0,0,0,.85); }
      .drivers h4 { margin: 0 0 6px; font-family: "Orbitron"; font-weight: 700; font-size: 13px; letter-spacing: 1px; }
      .drivers h4 b { color: var(--red); }
      .dhead, .drow { display: grid; grid-template-columns: 20px 1fr 58px 50px; align-items: center; gap: 5px; }
      .dhead { font-size: 10px; letter-spacing: 1px; color: var(--dim); text-transform: uppercase;
        padding-bottom: 5px; border-bottom: 1px solid var(--line); }
      #driverList { max-height: 60vh; overflow-y: auto; overflow-x: hidden; padding-right: 4px; }
      #driverList::-webkit-scrollbar { width: 5px; }
      #driverList::-webkit-scrollbar-thumb { background: rgba(120,150,220,.3); border-radius: 4px; }
      .drow { padding: 5px 0; border-bottom: 1px solid rgba(120,150,220,.07); font-size: 13px; }
      .drow .rk { color: var(--dim); } .drow .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .drow .col { font-weight: 700; } .drow .mx { font-family: "Orbitron"; font-weight: 700; font-size: 13px; text-align: right; }
      .drow.you { background: rgba(255,122,26,.12); border-radius: 8px; box-shadow: inset 0 0 0 1.5px var(--orange); padding: 5px 6px; }
      .col.red { color: var(--red); } .col.blue { color: var(--blue); } .col.yellow { color: var(--yellow); }
      .mx.cashed { color: var(--green1); } .mx.lost { color: var(--red); opacity: .6; } .mx.red{color:var(--red)} .mx.blue{color:var(--blue)} .mx.yellow{color:var(--yellow)}

      /* ============ NEXT RACE ============ */
      .nextrace { position: absolute; z-index: 4; right: 0; bottom: 0; padding: 9px 20px 9px 30px;
        background: linear-gradient(180deg, rgba(18,27,48,.95), rgba(11,17,31,.92)); border: none; border-top: 2px solid var(--orange);
        clip-path: polygon(16% 0, 100% 0, 100% 100%, 0 100%); font-family: "Orbitron"; font-weight: 700; font-size: 15px; }
      .nextrace .label { color: var(--dim); letter-spacing: 1px; font-size: 12px; }
      .nextrace .t { color: var(--orange2); }

      /* ============ CONTROLS ============ */
      .controls { display: flex; gap: 14px; padding: 14px 18px 18px; background: var(--bg); }
      .panel { background: linear-gradient(180deg, var(--panel), var(--panel2)); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
      .betpanel { flex: 1; min-width: 0; }
      /* desktop: the wrapper is invisible so BET 1 / BET 2 stay independent flex tiles;
         on mobile it becomes one combined tile (see responsive section) */
      .bets { display: contents; }
      .betpanel .ptitle { font-family: "Orbitron"; font-weight: 800; font-size: 16px; margin-bottom: 10px; }
      .carselect { display: flex; align-items: center; gap: 16px; margin: 0 18px; padding: 10px 16px;
        background: linear-gradient(180deg, var(--panel), var(--panel2)); border: 1px solid var(--line); border-radius: 14px; }
      .carselect .cslabel { flex: none; font-family: "Orbitron"; font-weight: 800; font-size: 13px;
        letter-spacing: 1px; color: var(--dim); text-transform: uppercase; }
      .carselect .carpick { flex: 1; margin-bottom: 0; }
      .carpick { display: flex; gap: 8px; margin-bottom: 12px; }
      .carchip { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 7px;
        background: #0a1120; border: 1.5px solid var(--line); border-radius: 9px; padding: 8px 4px; cursor: pointer;
        font-family: "Orbitron"; font-weight: 700; font-size: 12px; letter-spacing: .5px; color: var(--dim);
        text-transform: uppercase; transition: border-color .12s, color .12s, box-shadow .12s, background .12s; }
      .carchip .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); flex: none; }
      .carchip.red { --c: var(--red); } .carchip.blue { --c: var(--blue); } .carchip.yellow { --c: var(--yellow); }
      .carchip:hover { border-color: var(--c); color: var(--ink); }
      .carchip.on { color: var(--ink); border-color: var(--c); background: #0d1530;
        box-shadow: inset 0 0 18px -6px var(--c), 0 0 10px -4px var(--c); }
      .carchip:disabled { cursor: not-allowed; opacity: .45; }
      .fld { min-width: 0; }
      .fld + .fld { margin-top: 12px; }
      .fld .l { display: flex; align-items: center; justify-content: space-between; gap: 8px;
        font-size: 11px; letter-spacing: 1px; color: var(--dim); text-transform: uppercase; margin-bottom: 7px; }
      .amtstep { display: flex; align-items: stretch; gap: 8px; }
      .amtstep .amount { flex: 1; justify-content: center; }
      .amtstep input.in { text-align: center; }
      .amount { display: flex; align-items: center; height: 50px; background: #0a1120; border: 1px solid var(--line); border-radius: 9px; padding: 0 10px; }
      .amount .cur { color: var(--dim); font-weight: 700; font-family: "Orbitron"; font-size: 18px; margin-right: 2px; }
      .amount input.in { border: none; background: none; border-radius: 0; padding: 0 2px; height: 100%; }
      input.in { width: 100%; background: #0a1120; border: 1px solid var(--line); color: var(--ink);
        border-radius: 9px; padding: 0 12px; font-family: "Orbitron"; font-weight: 800; font-size: 22px; min-width: 0; }
      .sbtn { flex: none; width: 50px; background: #0a1120; border: 1px solid var(--line); border-radius: 9px;
        color: var(--ink); font-family: "Orbitron"; font-weight: 800; font-size: 24px; line-height: 1; cursor: pointer;
        transition: border-color .12s, background .12s; }
      .sbtn:hover { border-color: var(--orange); } .sbtn:active { background: #122036; }
      .quickadd { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; margin-top: 8px; }
      .quickadd button { background: #0a1120; border: 1px solid var(--line); border-radius: 8px; color: var(--dim);
        padding: 9px 0; font-family: "Orbitron"; font-weight: 700; font-size: 14px; cursor: pointer;
        transition: color .12s, border-color .12s, background .12s; }
      .quickadd button:hover { color: var(--ink); border-color: var(--orange); }
      .quickadd button:active { background: #122036; }
      .switch { position: relative; display: inline-block; width: 40px; height: 22px; flex: none; cursor: pointer; }
      .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
      .switch .sw { position: absolute; inset: 0; background: #0a1120; border: 1px solid var(--line); border-radius: 22px; transition: .15s; }
      .switch .sw::before { content: ""; position: absolute; left: 2px; top: 50%; transform: translateY(-50%);
        width: 15px; height: 15px; border-radius: 50%; background: var(--dim); transition: .15s; }
      .switch input:checked + .sw { background: linear-gradient(180deg, var(--green1), var(--green2)); border-color: transparent; }
      .switch input:checked + .sw::before { transform: translate(18px, -50%); background: #fff; }
      .numfld { display: flex; align-items: center; height: 50px; background: #0a1120; border: 1px solid var(--line);
        border-radius: 9px; padding: 0 12px; transition: opacity .15s; }
      .numfld.off { opacity: .4; }
      .numfld .pre, .numfld .suf { color: var(--dim); font-family: "Orbitron"; font-weight: 700; font-size: 16px; }
      .numfld .pre { margin-right: 2px; } .numfld .suf { font-size: 13px; margin-left: 6px; }
      .numfld input.in { border: none; background: none; border-radius: 0; padding: 0 2px; height: 100%; }
      .betpanel .cashbtn { width: 100%; margin-top: 12px; }
      .cashbtn { border: none; border-radius: 11px; padding: 6px 26px; min-height: 68px; cursor: pointer;
        font-family: "Orbitron"; font-weight: 800; font-size: 17px; letter-spacing: .5px;
        background: linear-gradient(180deg, var(--green1), var(--green2)); color: #fff;
        box-shadow: 0 6px 18px rgba(37,207,99,.32); transition: transform .05s; white-space: nowrap; text-shadow: 0 1px 2px rgba(0,0,0,.3); }
      .cashbtn:active { transform: scale(.97); }
      .cashbtn .sub { display: block; font-size: 10px; font-weight: 700; opacity: .85; }
      .cashbtn .cap { display: block; font-size: 12px; font-weight: 700; letter-spacing: 1px; opacity: .9; line-height: 1; }
      .cashbtn .amt { display: block; font-size: 32px; font-weight: 900; line-height: 1.1; letter-spacing: .5px; }
      .cashbtn:disabled { cursor: not-allowed; }
      .cashbtn.waiting { background: linear-gradient(180deg, #2b3650, #1d2740); color: var(--dim); box-shadow: none; }
      .cashbtn.won { background: linear-gradient(180deg, #1fd06e, #0c9a4e); }
      .cashbtn.lost { background: linear-gradient(180deg, #3a1620, #2a1016); color: var(--red); box-shadow: none; }

      /* ============ CHAT ============ */
      .chatpanel { width: 360px; display: flex; flex-direction: column; padding: 12px 16px; min-height: 0; overflow: hidden; }
      .chathead { flex: none; display: flex; justify-content: space-between; align-items: center; font-family: "Orbitron"; font-weight: 700; font-size: 14px; margin-bottom: 7px; }
      .chathead .dots { color: var(--dim); letter-spacing: 2px; }
      .chatlog { flex: 1 1 0; min-height: 0; overflow-y: auto; overflow-x: hidden; font-size: 14px; line-height: 1.55; }
      .chatlog::-webkit-scrollbar { width: 5px; } .chatlog::-webkit-scrollbar-thumb { background: rgba(120,150,220,.3); border-radius: 4px; }
      .chatlog .c b { color: var(--green1); font-weight: 700; } .chatlog .c.me b { color: var(--blue); }
      .chatlog .sys { color: var(--orange2); font-style: italic; }
      .chatin { flex: none; display: flex; gap: 7px; margin-top: 7px; }
      .chatin input { flex: 1; background: #0a1120; border: 1px solid var(--line); color: var(--ink); border-radius: 8px; padding: 9px 11px; font-family: "Rajdhani"; font-size: 14px; }
      .chatin button { background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 8px; width: 40px; cursor: pointer; font-size: 16px; }

      .verify { font-size: 11px; color: var(--dim); text-align: center; padding: 3px; cursor: pointer; min-height: 18px; }
      .verify b.ok { color: var(--green1); } .verify b.bad { color: var(--red); }
      .toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: #16203a;
        border: 1px solid var(--line); padding: 9px 16px; border-radius: 10px; font-size: 14px; box-shadow: var(--shadow);
        opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; }
      .toast.show { opacity: 1; }

      /* ============ LOADING SPLASH ============ */
      #loader { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center;
        justify-content: center; gap: 22px; background: radial-gradient(ellipse at center, #0e1730 0%, #060a14 75%);
        transition: opacity .5s ease; }
      #loader.hide { opacity: 0; pointer-events: none; }

    <script type="module">
      import { GameClient, verifyRound } from "./dist/index.js";
      import { demoSocket } from "./demo-server.js";

      const COLORS = { red: "var(--red)", blue: "var(--blue)", yellow: "var(--yellow)" };
      const ASSET = { red: "assets/car-red.png", blue: "assets/car-blue.png", yellow: "assets/car-yellow.png" };
      // cars with spinning-wheel frames: cycle these images while racing (speed-driven).
      // NB filenames are case-sensitive in production (Linux): red-/blue- lowercase, Yellow- capitalized.
      const CAR_FRAMES = {
        red: [1, 2, 3, 4].map((n) => `assets/red-carframe-${n}.png`),
        blue: [1, 2, 3, 4].map((n) => `assets/blue-carframe-${n}.png`),
        yellow: [1, 2, 3, 4].map((n) => `assets/Yellow-carframe-${n}.png`),
      };
      const wheelFrame = {};
      const $ = (id) => document.getElementById(id);
      const cap = (s) => s[0].toUpperCase() + s.slice(1);

      // ---------- sound (Web Audio: master gain = volume/mute, low-latency one-shots + loops) ----------
      const Sound = (() => {
        const FILES = {
          click: "assets/sfx/click.mp3", bet: "assets/sfx/betConf.mp3", overtake: "assets/sfx/overtake.mp3",
          rev: "assets/sfx/rev.mp3", ready1: "assets/sfx/ready1.mp3", ready2: "assets/sfx/ready2.mp3",
          ready3: "assets/sfx/ready3.mp3", engine: "assets/sfx/enginerace.mp3", music: "assets/sfx/synth.mp3",
        };
        let ctx, master, ready = false, initP = null;
        const buf = {}, loops = {};
        let enabled = localStorage.getItem("rr-sound") !== "off";
        let vol = Math.min(1, Math.max(0, parseFloat(localStorage.getItem("rr-vol") ?? "0.6")));
        const applyMaster = () => { if (master) master.gain.value = enabled ? vol : 0; };
        function init() { // cached: concurrent callers await the same load
          if (initP) { resume(); return initP; }
          initP = (async () => {
            try {
              ctx = new (window.AudioContext || window.webkitAudioContext)();
              master = ctx.createGain(); applyMaster(); master.connect(ctx.destination);
              await Promise.all(Object.entries(FILES).map(async ([k, u]) => {
                try { buf[k] = await ctx.decodeAudioData(await (await fetch(u)).arrayBuffer()); } catch {}
              }));
              ready = true;
            } catch {}
          })();
          return initP;
        }
        const resume = () => { if (ctx && ctx.state === "suspended") ctx.resume(); };
        function play(name, { volume = 1, rate = 1 } = {}) {
          if (!ready || !enabled || !buf[name]) return;
          const s = ctx.createBufferSource(); s.buffer = buf[name]; s.playbackRate.value = rate;
          const g = ctx.createGain(); g.gain.value = volume; s.connect(g); g.connect(master); s.start();
        }
        function startLoop(name, volume = 1) {
          if (!ready || loops[name] || !buf[name]) return;
          const s = ctx.createBufferSource(); s.buffer = buf[name]; s.loop = true;
          const g = ctx.createGain(); g.gain.value = volume; s.connect(g); g.connect(master); s.start();
          loops[name] = { s, g };
        }
        const stopLoop = (name) => { const l = loops[name]; if (l) { try { l.s.stop(); } catch {} delete loops[name]; } };
        const loopRate = (name, r) => { const l = loops[name]; if (l) l.s.playbackRate.value = r; };
        return {
          init, resume, play, startLoop, stopLoop, loopRate,
          setVolume(v) { vol = Math.min(1, Math.max(0, v)); localStorage.setItem("rr-vol", String(vol)); applyMaster(); },
          setEnabled(on) { enabled = on; localStorage.setItem("rr-sound", on ? "on" : "off"); applyMaster(); },
          get enabled() { return enabled; }, get volume() { return vol; }, get on() { return enabled && vol > 0; },
        };
      })();
      const sfx = (n, o) => Sound.play(n, o);

      const params = new URLSearchParams(location.search);
      let account = params.get("account");
      if (!account) { account = localStorage.getItem("rr-account") || ("racer" + Math.floor(1000 + Math.random() * 9000)); localStorage.setItem("rr-account", account); }
      // OFFLINE DEMO: the round loop runs in-browser (no backend). See demo-server.js.
      const client = new GameClient(demoSocket(account));
      const myMask = account.length <= 3 ? account[0] + "**" : account.slice(0, 3) + "***";

      const shown = {}, speed = {}, frozenP = {}, frozenV = {}, frozenDir = {}, lastP = {}; let target = {}, lastState = null, lastShift = 0;
      const spin = {}, spinTarget = {}, wasDead = {}; let camShake = 0; // car-liveness state
      let lastLeaderId = null; // for the overtake sound cue
      const autoCashOn = { 1: false, 2: false };  // auto cash-out toggle per slot
      const autoCashMult = { 1: 2.0, 2: 2.0 };    // typed cash-out multiplier
      const autoBetOn = { 1: false, 2: false };   // auto-bet toggle per slot
      const autoBetLeft = { 1: 0, 2: 0 };         // remaining auto-bet rounds while running
      let pickersFor = "";
      const history = {}; const recordedRounds = new Set(); let historyFor = ""; const HMAX = 10; // last N rounds per car
      const trackEl = $("track"); let bgScroll = 0; const BG_RATIO = 3168 / 1344;
      // camera follows the leader; track distance ∝ ln(multiplier). A crashed car's
      // distance freezes, so as the field pulls ahead it falls behind and slides off the left.
      const START = 26, KDIST = 40, ANCHOR = 70; // start just right of the LIVE DRIVERS panel (trailing x-number stays clear)
      const distOf = (m) => START + KDIST * Math.log(Math.max(1, m));

      function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1800); }

      // ---------- COSMETIC BOTS (client-only; never touch money/RTP) ----------
      const BOT_NAMES = ["Samaz", "Saran36", "Kotefraa", "Skate", "RophtiD", "Romaniirex", "swinhatt", "NeoDrift", "VortX", "Lap_King", "Mr.Boost", "Zephyr",
        "Nitro_Sam", "DriftKid", "ApexHunt", "RedShift", "TurboG", "GridLock", "PitViper", "FastLane", "Octane", "Slipstrm", "BoostJr", "Maverik", "Pole_Pos", "Vroomz"];
      let bots = [];
      function spawnBots(carIds) {
        const n = 16 + Math.floor(Math.random() * 5); // 16..20 bots
        const pool = [...BOT_NAMES].sort(() => Math.random() - 0.5);
        bots = pool.slice(0, n).map((name) => ({
          name, carId: carIds[Math.floor(Math.random() * carIds.length)],
          target: +(1.2 + Math.random() * 4).toFixed(2), status: "active", mult: 1,
        }));
      }
      function updateBots(cars) {
        for (const b of bots) {
          const car = cars.find((c) => c.id === b.carId); if (!car) continue;
          const m = shown[b.carId] ?? car.multiplier ?? 1;
          if (b.status !== "active") continue;
          if (car.brokenDown && m < b.target) { b.status = "lost"; }
          else if (m >= b.target) { b.status = "cashed"; b.mult = b.target; }
          else b.mult = m;
        }
      }

      // ---------- track build ----------
      let builtFor = "";
      function buildTrack(carIds) {
        if (builtFor === carIds.join()) return;
        builtFor = carIds.join();
        const lanes = $("lanes"); lanes.innerHTML = "";
        carIds.forEach((id) => {
          const lane = document.createElement("div");
          lane.className = `lane ${id}`; lane.id = `lane-${id}`; lane.style.color = COLORS[id];
          // all wheel frames preloaded as stacked imgs; we toggle which is visible (no per-frame src swap = no decode stutter)
          const wheels = CAR_FRAMES[id]
            ? `<div class="wheels" id="wheels-${id}">` + CAR_FRAMES[id].map((src, i) => `<img src="${src}" alt=""${i === 0 ? ' class="on"' : ''} />`).join("") + `</div>`
            : "";
          lane.innerHTML = `<div class="mult" id="mult-${id}">x1.00</div><div class="trail" id="trail-${id}"></div><div class="shadow" id="shadow-${id}"></div>`
            + `<div class="carwrap" id="carwrap-${id}">`
            +   `<div class="exhaust"></div>`

      // --- auto cash-out & auto bet: toggle switches + typed values ---
      const readCash = (slot) => { autoCashMult[slot] = Math.max(1.1, parseFloat($(`acval${slot}`).value) || 1.1); };
      const readRounds = (slot) => Math.max(1, parseInt($(`abval${slot}`).value, 10) || 1);
      function refreshAuto(slot) {
        $(`acnum${slot}`).classList.toggle("off", !autoCashOn[slot]);
        $(`abnum${slot}`).classList.toggle("off", !autoBetOn[slot]);
      }
      for (const slot of [1, 2]) {
        $(`actog${slot}`).onchange = (e) => { sfx("click"); autoCashOn[slot] = e.target.checked; readCash(slot); refreshAuto(slot); };
        $(`abtog${slot}`).onchange = (e) => { sfx("click"); autoBetOn[slot] = e.target.checked; autoBetLeft[slot] = e.target.checked ? readRounds(slot) : 0; refreshAuto(slot); if (lastState && lastState.phase === "betting") scheduleAutoBet(lastState); };
        $(`acval${slot}`).oninput = () => readCash(slot);
        $(`abval${slot}`).oninput = () => { if (autoBetOn[slot]) autoBetLeft[slot] = readRounds(slot); };
      }
      [1, 2].forEach(refreshAuto);
      $("topup").onclick = () => { sfx("click"); client.topUp(); };

      // ---- sound control (volume slider + mute) ----
      function refreshSoundUI() {
        $("soundBtn").textContent = Sound.on ? "🔊" : "🔇";
        $("soundBtn").classList.toggle("off", !Sound.on);
        $("soundVol").value = Math.round(Sound.volume * 100);
        $("soundPct").textContent = Math.round(Sound.volume * 100) + "%";
        $("soundMute").textContent = Sound.enabled ? "Mute" : "Unmute";
        $("soundMute").classList.toggle("muted", !Sound.enabled);
      }
      $("soundBtn").onclick = () => { Sound.init(); $("soundPop").classList.toggle("open"); refreshSoundUI(); };
      $("soundVol").oninput = (e) => { Sound.init(); Sound.setVolume(Number(e.target.value) / 100); refreshSoundUI(); };
      $("soundMute").onclick = () => { Sound.init(); Sound.setEnabled(!Sound.enabled); if (Sound.enabled) Sound.startLoop("music", 0.35); refreshSoundUI(); };
      document.addEventListener("click", (e) => { if (!$("soundctl").contains(e.target)) $("soundPop").classList.remove("open"); });
      refreshSoundUI();
      // unlock audio on the first user gesture (autoplay policy), then start ambient music
      const armAudio = async () => { await Sound.init(); Sound.resume(); Sound.startLoop("music", 0.35); };
      window.addEventListener("pointerdown", armAudio, { once: true });
      window.addEventListener("keydown", armAudio, { once: true });

      $("driversToggle").onclick = () => { sfx("click"); $("drivers").classList.add("open"); $("driversToggle").style.display = "none"; };
      $("driversClose").onclick = () => { sfx("click"); $("drivers").classList.remove("open"); $("driversToggle").style.display = ""; };
      $("rhToggle").onclick = () => { sfx("click"); $("rhistory").classList.add("open"); $("rhToggle").style.display = "none"; $("soundctl").classList.add("shift"); };
      $("chatsend").onclick = () => { sfx("click"); sendChat(); };
      $("chatinput").addEventListener("keydown", (e) => { if (e.key === "Enter") sendChat(); });
      function sendChat() { const i = $("chatinput"), t = i.value.trim(); if (t) { client.chat(t); i.value = ""; } }
      function escapeHtml(s) { return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

      sys(`Welcome, ${account}. Pick a car (click a lane), place up to 2 bets, cash out before it breaks down.`);

      // ---------- loading splash: preload heavy art + wait for the first game state ----------
      (function showLoader() {
        const imgs = [
          "assets/logo-redline-rush.png", "assets/bg-landscape2.png", "assets/tirewall.png",
          "assets/car-red.png", "assets/car-blue.png", "assets/car-yellow.png",
          ...Object.values(CAR_FRAMES).flat(),
        ];
        const total = imgs.length;
        let loaded = 0, firstState = false, fontsReady = false, hidden = false;
        const setBar = () => { const el = $("loaderFill"); if (el) el.style.width = Math.round((loaded / total) * 100) + "%"; };
        const bump = () => { loaded++; setBar(); check(); };
        imgs.forEach((src) => { const im = new Image(); im.onload = im.onerror = bump; im.src = src; });
        client.onUpdate(() => { firstState = true; check(); });
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { fontsReady = true; check(); });
        else fontsReady = true;
        function check() {
          if (hidden) return;
          if (loaded >= total && firstState && fontsReady) hide();
        }
        function hide() {
          hidden = true;
          const l = $("loader"); if (!l) return;
          $("loaderText").textContent = "Ready";
          $("loaderFill").style.width = "100%";
          l.classList.add("hide");
          setTimeout(() => l.remove(), 600);
        }
        setTimeout(() => { if (!hidden) hide(); }, 8000); // safety: never hang if the socket stalls
      })();
    </script>
  </body>
</html>
