<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  @font-face { font-family: "General Sans"; src: url("fonts/general-sans-600.woff2") format("woff2"); font-weight: 600; }
  @font-face { font-family: "General Sans"; src: url("fonts/general-sans-700.woff2") format("woff2"); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "General Sans", "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(60% 70% at 12% 0%, rgba(31,188,230,0.26), transparent 55%),
      radial-gradient(60% 70% at 88% 100%, rgba(43,208,125,0.26), transparent 55%),
      #06070a;
    color: #eef2f5;
    position: relative;
  }
  .bars { position: absolute; inset: 0; opacity: 0.10;
    background-image: repeating-linear-gradient(90deg, #2bd07d 0 2px, transparent 2px 14px);
    -webkit-mask-image: radial-gradient(circle at 50% 50%, transparent 30%, #000 95%);
            mask-image: radial-gradient(circle at 50% 50%, transparent 30%, #000 95%);
  }
  .wrap { position: relative; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 60px; }
  .logo { height: 188px; width: auto; display: block; margin-bottom: 30px; filter: drop-shadow(0 10px 40px rgba(43,208,125,0.25)); }
  .word { font-size: 64px; font-weight: 700; letter-spacing: -1px; line-height: 1; }
  .word .grad { background: linear-gradient(105deg, #1fbce6, #2bd07d); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tag { font-size: 28px; color: rgba(238,242,245,0.72); margin-top: 22px; font-weight: 500; }
  .url { position: absolute; bottom: 46px; left: 0; right: 0; text-align: center; font-size: 24px; font-weight: 700; color: #2bd07d; letter-spacing: 0.5px; }
</style>
</head>
<body>
  <div class="bars"></div>
  <div class="wrap">
    <img class="logo" src="logo-mark.png" alt="" />
    <div class="word">ron<span class="grad">IGAMING</span></div>
    <div class="tag">Custom iGaming slots, designed and built end to end</div>
  </div>
  <div class="url">ronigames.org</div>
</body>
</html>
